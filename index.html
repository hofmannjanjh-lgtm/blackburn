<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Blackburn Highlights</title>
<style>
  :root { --bg:#111418; --panel:#1b2027; --text:#e8ecf1; --muted:#8a94a3; --accent:#2f7de1; --line:#2a313b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width:1400px; margin:0 auto; padding:16px; display:grid; grid-template-columns:1fr 380px; gap:16px; }
  @media (max-width:900px) { .wrap { grid-template-columns:1fr; } }
  h1 { font-size:18px; margin:0 0 4px; }
  select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; margin:4px 0 8px; max-width:100%; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:12px; }
  .video { position:relative; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; }
  .video > div, .video iframe { position:absolute; inset:0; width:100%; height:100%; }
  .bar { display:flex; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .now { flex:1; min-width:200px; }
  .now b { display:block; }
  .now span { color:var(--muted); font-size:13px; }
  .prog { height:4px; background:var(--line); border-radius:2px; margin-top:6px; overflow:hidden; }
  .prog i { display:block; height:100%; width:0; background:var(--accent); }
  ol { list-style:none; margin:0; padding:0; background:var(--panel); border-radius:8px; max-height:calc(100vh - 32px); overflow:auto; }
  li { padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:grid; grid-template-columns:28px 1fr; gap:4px; }
  li:hover { background:#232a33; }
  li.active { background:#1f3350; }
  li.done .t { color:var(--muted); }
  li .n { color:var(--muted); font-variant-numeric:tabular-nums; }
  li .z { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .err { display:none; margin-top:12px; padding:10px 12px; background:#4a1f1f; border-radius:6px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>FM27 Blackburn Rovers: Highlights</h1>
    <select id="ep"></select>
    <div class="sub" id="sub"></div>
    <div class="video"><div id="player"></div></div>
    <div class="bar">
      <button id="prev">◀ Zurück</button>
      <button id="next">Weiter ▶</button>
      <div class="now"><b id="title">Lädt …</b><span id="info"></span><div class="prog"><i id="bar"></i></div></div>
    </div>
    <div class="err" id="err"></div>
  </div>
  <ol id="list"></ol>
</div>

<script>

zit"],[15408,15480,"West Brom: Umstellung"],[15666,15709,"West Brom: Szene 4"],[15865,15893,"West Brom: Volle Offensive"],[16006,16065,"West Brom: Schlussphase"],[16150,16181,"West Brom: Fazit"],[17129,17192,"Anfragen an den Vorstand"],[17295,17333,"Antwort des Vorstands"],[17394,17480,"Ein Transferziel"],[17517,17563,"Transferziel: Das Problem"],[17768,17797,"Wrexham (H): Gegner"],[17839,17905,"Wrexham: Szene 1"],[17908,17976,"Wrexham: Szene 2"],[18038,18118,"Wrexham: Szene 3"],[18214,18270,"Wrexham: Fazit & Blick auf den Pokal"],[18455,18515,"Vertragsverhandlung"],[18849,18896,"Vertragsverhandlung: Entscheidung"],[19486,19598,"Everton (H): Gegneranalyse"],[19715,19753,"Everton: Das bislang größte Spiel"],[19802,19857,"Everton: Anpfiff"],[20025,20108,"Everton: Szene 1"],[20122,20159,"Everton: Halbzeit"],[20164,20251,"Everton: Szene 2"],[20393,20459,"Everton: Schlussphase"],[20532,20852,"Everton: Entscheidung"],[20852,20900,"Everton: Fazit"],[20903,21006,"Bilanz des Streams"]] },
  { id: "0U3XPMrs39c", titel: "Episode 4", seg: [[640,731,"Rückblick"],[1577,1652,"Swansea (A): Gegneranalyse"],[1824,1877,"Swansea: Anpfiff"],[1939,2014,"Swansea: Szene 1"],[2076,2178,"Swansea: Szene 2"],[2186,2244,"Swansea: Halbzeit-Anpassung"],[2273,2311,"Swansea: Wechsel"],[2398,2431,"Swansea: Schlussphase"],[2461,2476,"Swansea: Abpfiff"],[2652,2691,"Swansea: Fazit & Tabelle"],[2816,2881,"Testspiel-Planung & Vorstand"],[3129,3152,"Transfer-Update"],[3218,3254,"Stoke (H): Gegner"],[3739,3787,"Stoke: Szene 1"],[4054,4106,"Stoke: Szene 2"],[4121,4201,"Stoke: Schlussphase"],[4259,4296,"Stoke: Fazit"],[4534,4606,"Kaderplanung"],[5233,5387,"Partnerverein: Ausflug"],[5415,5446,"Partnerverein: Entscheidung"],[5616,5674,"West Ham (H): Gegneranalyse"],[5880,5964,"West Ham: Szene 1"],[5979,6089,"West Ham: Szene 2"],[6089,6161,"West Ham: Umstellung"],[6363,6396,"West Ham: Szene 3"],[6453,6516,"West Ham: Schlussphase"],[6561,6672,"West Ham: Fazit"],[7666,7722,"Kaderplanung: Torwart"],[8171,8308,"Kaderplanung: Rückrunde"],[8327,8346,"Kaderplanung: Bedarf"],[9389,9488,"Transfer-News"],[11054,11121,"Burnley (A): Stadionbesuch"],[11402,11467,"Burnley: Gegneranalyse"],[11582,11623,"Burnley: Anpfiff"],[11934,11978,"Burnley: Szene 1"],[12203,12227,"Burnley: Szene 2"],[12359,12382,"Burnley: Szene 3"],[12555,12623,"Burnley: Fazit"],[12954,13093,"Transfer-Telefonat"],[13165,13190,"Watford (A): Vorbereitung"],[13594,13621,"Watford: Szene 1"],[13631,13655,"Watford: Szene 2"],[13715,13821,"Watford: Halbzeit"],[13833,13913,"Watford: Szene 3"],[14007,14076,"Watford: Schlussphase"],[14304,14396,"Watford: Nachspielzeit"],[14426,14466,"Watford: Fazit"],[15107,15186,"Charlton (H): Gegneranalyse"],[15394,15455,"Charlton: Halbzeit"],[15518,15561,"Charlton: Szene 1"],[15631,15695,"Charlton: Schlussphase"],[15737,15778,"Charlton: Fazit"],[16087,16139,"Nachrichten"],[17062,17167,"Vertragsverhandlung"],[17455,17509,"Teamanalyse 1"],[18102,18147,"Teamanalyse 2"],[18612,18656,"Bolton (A): Vorbereitung"],[18818,18847,"Bolton: Szene 1"],[18889,18908,"Bolton: Szene 2"],[18958,19053,"Bolton: Umstellung"],[19204,19246,"Bolton: Wechsel"],[19370,19452,"Bolton: Schlussphase"],[19455,19516,"Bolton: Fazit"],[19954,20050,"FA-Cup-Auslosung"],[20082,20131,"Norwich (H): Vorbereitung"],[20246,20293,"Norwich: Anpfiff"],[20394,20438,"Norwich: Szene 1"],[20469,20488,"Norwich: Szene 2"],[20566,20586,"Norwich: Szene 3"],[20731,20801,"Norwich: Schlussphase"],[21481,21535,"Zwischenbilanz"],[21911,21979,"Derby County (H): Gegneranalyse"],[22224,22268,"Derby: Szene 1"],[22289,22347,"Derby: Szene 2"],[22361,22450,"Derby: Halbzeit"],[22458,22514,"Derby: Szene 3"],[22547,22586,"Derby: Szene 4"],[22726,22831,"Derby: Schlussphase"],[22922,22966,"Derby: Nachspielzeit"],[23020,23140,"Derby: Fazit & Bilanz"]] },
];

const hashEp = parseInt((location.hash.match(/ep(\d+)/) || [])[1], 10) - 1;
let gespeichert = -1;
try { gespeichert = parseInt(localStorage.getItem("bb_ep"), 10); } catch (e) {}
let ep = (hashEp >= 0 && hashEp < EPISODEN.length) ? hashEp
       : (gespeichert >= 0 && gespeichert < EPISODEN.length) ? gespeichert : 0;
let VIDEO = EPISODEN[ep].id, SEG = EPISODEN[ep].seg;
const fmt = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };

let cur = 0, player, timer, advancing = false;

const list = document.getElementById("list");
function bauListe() {
list.innerHTML = "";
SEG.forEach(([a, b, t], i) => {
  const li = document.createElement("li");
  li.innerHTML = `<span class="n">${i + 1}</span><span><span class="t"></span><br><span class="z">${fmt(a)} – ${fmt(b)} · ${fmt(b - a)} Min.</span></span>`;
  li.querySelector(".t").textContent = t;
  li.onclick = () => play(i);
  list.appendChild(li);
});
const ges = SEG.reduce((x, [a, b]) => x + b - a, 0);
document.getElementById("sub").textContent = `${SEG.length} Abschnitte, ca. ${Math.round(ges / 60)} Minuten. Springt automatisch zum nächsten Abschnitt.`;
}
function ladeFortschritt() {
  cur = 0;
  try { const v = parseInt(localStorage.getItem("bb_seg_" + VIDEO) ?? (ep === 0 ? localStorage.getItem("bb_seg") : null), 10); if (v >= 0 && v < SEG.length) cur = v; } catch (e) {}
}
ladeFortschritt();
bauListe();

function mark() {
  [...list.children].forEach((li, i) => { li.classList.toggle("active", i === cur); li.classList.toggle("done", i < cur); });
  list.children[cur].scrollIntoView({ block: "nearest" });
  const [a, b, t] = SEG[cur];
  document.getElementById("title").textContent = `${cur + 1}/${SEG.length}: ${t}`;
  try { localStorage.setItem("bb_seg_" + VIDEO, cur); } catch (e) {}
}

function play(i) {
  if (i < 0 || i >= SEG.length) return;
  cur = i; advancing = false; mark();
  const [a, b] = SEG[i];
  player.loadVideoById({ videoId: VIDEO, startSeconds: a, endSeconds: b });
}

function next() {
  if (advancing) return;
  advancing = true;
  if (cur + 1 < SEG.length) play(cur + 1);
  else { document.getElementById("title").textContent = "Fertig – alle Highlights gesehen."; player.pauseVideo(); }
}

function tick() {
  if (!player || !player.getCurrentTime) return;
  const [a, b] = SEG[cur], t = player.getCurrentTime();
  document.getElementById("info").textContent = `${fmt(Math.min(Math.max(t - a, 0), b - a))} / ${fmt(b - a)}  ·  Original ${fmt(t)}`;
  document.getElementById("bar").style.width = Math.min(100, Math.max(0, (t - a) / (b - a) * 100)) + "%";
  if (t >= b - 0.3 && player.getPlayerState() === 1) next();
}

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player("player", {
    videoId: VIDEO,
    playerVars: { start: SEG[cur][0], end: SEG[cur][1], rel: 0, playsinline: 1, origin: location.origin },
    events: {
      onReady: () => { mark(); timer = setInterval(tick, 250); },
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) next(); if (e.data === YT.PlayerState.PLAYING) advancing = false; },
      onError: e => {
        const box = document.getElementById("err");
        box.style.display = "block";
        box.textContent = (e.data === 101 || e.data === 150 || e.data === 153)
          ? "YouTube verweigert die Wiedergabe in dieser Seite (Fehler " + e.data + "). Öffne die Seite über http://localhost:8000 (siehe Anleitung), nicht per Doppelklick."
          : "YouTube-Fehler " + e.data + ".";
      }
    }
  });
};

const sel = document.getElementById("ep");
EPISODEN.forEach((e, i) => { const o = document.createElement("option"); o.value = i; o.textContent = e.titel; sel.appendChild(o); });
sel.value = ep;
sel.onchange = () => {
  ep = +sel.value; VIDEO = EPISODEN[ep].id; SEG = EPISODEN[ep].seg;
  history.replaceState(null, "", "#ep" + (ep + 1));
  try { localStorage.setItem("bb_ep", ep); } catch (e) {}
  ladeFortschritt(); bauListe(); mark();
  player.cueVideoById({ videoId: VIDEO, startSeconds: SEG[cur][0], endSeconds: SEG[cur][1] });
};

document.getElementById("prev").onclick = () => play(cur - 1);
document.getElementById("next").onclick = () => { advancing = false; next(); };
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" && e.shiftKey) { advancing = false; next(); }
  if (e.key === "ArrowLeft" && e.shiftKey) play(cur - 1);
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
