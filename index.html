function mark() {

  document.getElementById("title").textContent = `${cur + 1}/${SEG.length}: ${t}`;
  try { localStorage.setItem("bb_t_" + VIDEO, SEG[cur][0]); } catch (e) {}

function play(i) {
  if (i < 0 || i >= SEG.length) return;
  cur = i; advancing = false; mark();
  const [a, b] = SEG[i];
  player.loadVideoById({ videoId: VIDEO, startSeconds: a, endSeconds: b });
}

  if (cur + 1 < SEG.length) play(cur + 1);
  else { document.getElementById("title").textContent = "Fertig – alle Highlights gesehen."; player.pauseVideo(); }
}

function tick() {

  document.getElementById("info").textContent = `${fmt(Math.min(Math.max(t - a, 0), b - a))} / ${fmt(b - a)}  ·  Original ${fmt(t)}`;

  if (t >= b - 0.3 && player.getPlayerState() === 1) next();
}
